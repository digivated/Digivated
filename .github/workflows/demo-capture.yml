name: Demo capture
on:
  push:
    branches: [demo-capture]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-color-emoji >/dev/null || true
      - run: node scripts/demo-capture.mjs
      - name: Commit captures back to this branch
        run: |
          git config user.name "demo-capture"
          git config user.email "demo-capture@users.noreply.github.com"
          git add -f demo-capture
          git commit -m "Demo captures" -q
          git push -q origin HEAD:demo-capture
