name: Demo capture
on:
  push:
    branches: [demo-capture]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-color-emoji >/dev/null || true
      - run: node scripts/demo-capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: demo-capture
          path: demo-capture/
