name: QA baseline refresh

# Manual only. Regenerates the committed screenshot baseline from the live site and opens a pull
# request so the visual change is reviewed before it replaces the baseline. It never touches main.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: digivated-qa-baseline
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Regenerate screenshots from production
        continue-on-error: true
        env:
          QA_BASE_URL: https://digivated.com
        run: npx playwright test --config=qa/playwright.config.ts --update-snapshots
      - name: Open a pull request with the new baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/monitor.spec.ts-snapshots
          if git diff --cached --quiet; then echo "Baseline already matches production."; exit 0; fi
          git checkout -B qa-baseline-refresh
          git commit -m "Refresh QA screenshot baseline from production"
          git push --force origin qa-baseline-refresh
          gh pr create --base main --head qa-baseline-refresh \
            --title "Refresh QA screenshot baseline" \
            --body "Regenerated from https://digivated.com. Review the changed images before merging; merging replaces the visual baseline the QA monitor compares against." || echo "A pull request already exists."
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: digivated-qa-baseline
          path: qa/monitor.spec.ts-snapshots/
          retention-days: 7
