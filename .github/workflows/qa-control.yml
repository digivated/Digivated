name: QA control

on:
  workflow_dispatch:
    inputs:
      command:
        description: STOP or PAUSE closes the QA gate and cancels runs; RESUME reopens it.
        required: true
        type: choice
        options:
          - STOP
          - PAUSE
          - RESUME

permissions:
  actions: write
  contents: write

concurrency:
  group: digivated-qa-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply and verify control
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node qa/control.mjs '${{ inputs.command }}'
