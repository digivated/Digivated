name: Digivated QA control

on:
  workflow_dispatch:
    inputs:
      command:
        description: STOP or PAUSE immediately disables and cancels QA runs; RESUME reactivates them.
        required: true
        type: choice
        options:
          - STOP
          - PAUSE
          - RESUME

permissions:
  actions: write
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply and verify control
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node qa/control.mjs '${{ inputs.command }}'
