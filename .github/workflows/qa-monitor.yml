name: Digivated QA monitor

on:
  schedule:
    - cron: '9 * * * *'
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: digivated-qa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-checks:
    if: >-
      (github.event_name != 'deployment_status' ||
       (github.event.deployment_status.state == 'success' &&
        (github.event.deployment.environment == 'Preview' || github.event.deployment.environment == 'Production')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the live monitor gate
        id: switch
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DEPLOY_ENV: ${{ github.event.deployment.environment }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/contents/qa/mode.json?ref=main" --jq '.content' | base64 --decode | jq -r '.mode')
          active=$([ "$mode" = ACTIVE ] && echo true || echo false)
          # Protected previews redirect to a Vercel sign-in page without the bypass secret, so the
          # check can only fail. Skip it with a visible notice instead of sending a failure email.
          if [ "$EVENT" = deployment_status ] && [ "$DEPLOY_ENV" = Preview ] && [ -z "$BYPASS" ]; then
            echo "::notice::Preview checks skipped: add the VERCEL_AUTOMATION_BYPASS_SECRET repository secret to enable them."
            active=false
          fi
          echo "active=$active" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.switch.outputs.active == 'true'
      - uses: actions/setup-node@v4
        if: steps.switch.outputs.active == 'true'
        with:
          node-version: 24
          cache: npm
      - if: steps.switch.outputs.active == 'true'
        run: npm ci
      - if: steps.switch.outputs.active == 'true'
        run: npx playwright install --with-deps chromium
      - name: Check public pages, flows, assets, and screenshots
        if: steps.switch.outputs.active == 'true'
        id: browser
        env:
          QA_BASE_URL: ${{ github.event_name == 'deployment_status' && github.event.deployment.environment == 'Preview' && github.event.deployment_status.environment_url || 'https://digivated.com' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test --config=qa/playwright.config.ts
      - name: Open deduplicated issues for repeated production failures
        if: always() && steps.browser.outcome == 'failure' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.deployment.environment == 'Production')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QA_ISSUES_ENABLED: 'true'
        run: node qa/triage.mjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.switch.outputs.active == 'true'
        with:
          name: digivated-qa-evidence
          path: |
            test-results/qa/
            test-results/qa-report.json
          retention-days: 7
