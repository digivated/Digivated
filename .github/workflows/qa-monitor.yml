name: Digivated QA monitor

on:
  schedule:
    - cron: '9 * * * *'
  workflow_dispatch:
    inputs:
      preview_url:
        description: Optional Digivated Vercel preview origin; leave empty for production.
        required: false
        type: string
  deployment_status:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: digivated-qa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-checks:
    if: >-
      (github.event_name != 'deployment_status' ||
       (github.event.deployment_status.state == 'success' &&
        (github.event.deployment.environment == 'Preview' || github.event.deployment.environment == 'Production')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the live monitor gate
        id: switch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/contents/qa/mode.json?ref=main" --jq '.content' | base64 --decode | jq -r '.mode')
          echo "active=$([ "$mode" = ACTIVE ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.switch.outputs.active == 'true'
      - uses: actions/setup-node@v4
        if: steps.switch.outputs.active == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Validate QA target
        if: steps.switch.outputs.active == 'true'
        id: target
        env:
          INPUT_URL: ${{ inputs.preview_url }}
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url }}
          IS_PREVIEW_EVENT: ${{ github.event_name == 'deployment_status' && github.event.deployment.environment == 'Preview' }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { qaTarget } from './qa/preview-access.mjs';
          if (process.env.IS_PREVIEW_EVENT === 'true' && !process.env.DEPLOYMENT_URL) throw new Error('Preview deployment URL is missing.');
          const { baseURL, preview } = qaTarget(process.env.INPUT_URL ||
            (process.env.IS_PREVIEW_EVENT === 'true' ? process.env.DEPLOYMENT_URL : 'https://digivated.com'));
          appendFileSync(process.env.GITHUB_OUTPUT, `url=${baseURL}\npreview=${preview}\n`);
          JS
      - if: steps.switch.outputs.active == 'true'
        run: npm ci
      - if: steps.switch.outputs.active == 'true'
        run: npx playwright install --with-deps chromium
      - name: Check public pages, flows, assets, and screenshots
        if: steps.switch.outputs.active == 'true'
        id: browser
        env:
          QA_BASE_URL: ${{ steps.target.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ steps.target.outputs.preview == 'true' && secrets.VERCEL_AUTOMATION_BYPASS_SECRET || '' }}
        run: |
          if [ '${{ steps.target.outputs.preview }}' = true ] && [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo '::error::Protected preview QA requires VERCEL_AUTOMATION_BYPASS_SECRET in GitHub Actions secrets.'
            exit 1
          fi
          npx playwright test --config=qa/playwright.config.ts
      - name: Open deduplicated issues for repeated production failures
        if: always() && steps.browser.outcome == 'failure' && steps.target.outputs.preview == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QA_ISSUES_ENABLED: 'true'
        run: node qa/triage.mjs
      - uses: actions/upload-artifact@v4
        if: always() && steps.switch.outputs.active == 'true'
        with:
          name: digivated-qa-evidence
          path: |
            test-results/qa/
            test-results/qa-report.json
          retention-days: 7
