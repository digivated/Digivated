name: Digivated QA monitor

on:
  schedule:
    - cron: '9 * * * *'
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read
  issues: write

concurrency:
  group: digivated-qa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-checks:
    if: >-
      vars.DIGIVATED_QA_MODE == 'ACTIVE' &&
      (github.event_name != 'deployment_status' ||
       (github.event.deployment_status.state == 'success' &&
        (github.event.deployment.environment == 'Preview' || github.event.deployment.environment == 'Production')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check public pages, flows, assets, and screenshots
        id: browser
        env:
          QA_BASE_URL: ${{ github.event_name == 'deployment_status' && github.event.deployment.environment == 'Preview' && github.event.deployment_status.environment_url || 'https://digivated.com' }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test --config=qa/playwright.config.ts
      - name: Open deduplicated issues for repeated production failures
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event.deployment.environment == 'Production')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QA_ISSUES_ENABLED: 'true'
        run: node qa/triage.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digivated-qa-evidence
          path: |
            test-results/qa/
            test-results/qa-report.json
          retention-days: 7
