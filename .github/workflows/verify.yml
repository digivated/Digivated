name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_browser_suite:
        description: Include historical browser tests for older layouts
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check syntax
        run: npm run check:syntax

      - name: Build production site
        run: npm run build
        env:
          PUBLIC_SENTRY_DSN: https://public@o4512195501228032.ingest.us.sentry.io/4512195596386304

      - name: Install browser for monitoring verification
        run: npx playwright install --with-deps chromium

      # The owner dashboard has a separate workflow with its own Redis fixture.
      # These suites cover current public behavior and browser privacy.
      - name: Verify current browser flows and privacy
        run: >-
          npx playwright test
          tests/browser/community-paused.spec.ts
          tests/browser/creator-seo.spec.ts
          tests/browser/creators-experience.spec.ts
          tests/browser/free-launch-guide.spec.ts
          tests/browser/login.spec.ts
          tests/browser/gumroad-secure-setup.spec.ts
          tests/browser/launch-calendar.spec.ts
          tests/browser/membership-offer.spec.ts
          tests/browser/mobile-stability.spec.ts
          tests/browser/news-paused.spec.ts
          tests/browser/rankings-experience.spec.ts
          tests/browser/sentry.spec.ts

      # Keep the full suite available while older layout assertions are reviewed.
      - name: Run full browser suite
        if: github.event_name == 'workflow_dispatch' && inputs.full_browser_suite
        run: npx playwright test

      - name: Upload mobile visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-visual-review
          path: |
            test-results/mobile/
            test-results/community*.png
          if-no-files-found: ignore
