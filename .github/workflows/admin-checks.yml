name: Owner dashboard verification
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: owner-dashboard-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5
    env:
      DIGIVATED_TEST_REDIS_PORT: '6379'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test --test-concurrency=1 tests/admin.test.mjs tests/admin-accounts.test.mjs tests/admin-overview.test.mjs tests/notifications.test.mjs tests/project-views.test.mjs tests/launch-collections.test.mjs tests/discussions.test.mjs tests/threads.test.mjs tests/feedback-points.test.mjs tests/launch-visibility.test.mjs tests/badge-first-launch.test.mjs tests/project-account.test.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/admin-workspace.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-visual-review
          path: test-results/**/*.png
